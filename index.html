<div id="app"></div>
<template id="dc-template">
<div class="page" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1C2127">

<!-- ================= TOP BAR ================= -->
<div class="top">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
<div style="font-family: 'Newsreader', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.05; letter-spacing: -0.01em">Ocular Motility Lab</div>
<div style="font-size: 12.5px; line-height: 1.3; color: #5E6670">Eye movements, pupils &amp; red reflex — content aligned with AAO BCSC §5 &amp; §6 and EUPO 2016</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div role="tablist" aria-label="Module" style="display: flex; gap: 3px; padding: 4px; background: #1C2127; border-radius: 12px">
<sc-for list="{{modules}}" as="it" hint-placeholder-count="2">
<button class="btn" role="tab" aria-selected="{{it.on}}" onClick="{{it.pick}}" style="height: 40px; padding: 0 16px; border: none; border-radius: 9px; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 14px">{{it.label}}</button>
</sc-for>
</div>
<button class="btn" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="height: 48px; min-width: 104px; padding: 0 16px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid #1C2127; border-radius: 12px; background: #FFFFFF; color: #1C2127; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13.5px">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1.5" width="3.4" height="11" rx="1" style="fill: #1C2127"></rect><rect x="8.6" y="1.5" width="3.4" height="11" rx="1" style="fill: #1C2127"></rect></svg>
</sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" style="fill: #1C2127"></path></svg>
</sc-if>
<span>{{playLabel}}</span>
</button>
</div>
</div>

<!-- ============================================================ -->
<!-- ================= MODULE 1: EYE MOVEMENTS ================== -->
<!-- ============================================================ -->
<sc-if value="{{isMot}}" hint-placeholder-val="{{true}}">
<div class="layout">

<!-- LEFT -->
<div class="leftcol" style="background: #FFFFFF; border: 1px solid #DDD7CB; border-radius: 14px; padding: 14px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{notSolo}}" hint-placeholder-val="{{true}}">
<div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #6B6258">Affected eye (one-sided conditions)</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{sides}}" as="it" hint-placeholder-count="2">
<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="height: 40px; border-radius: 9px; border: 1.5px solid {{it.bd}}; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px">{{it.label}}</button>
</sc-for>
</div>
<div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #6B6258; margin-top: 4px">Condition</div>
<div class="scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding-right: 4px">
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="6">
<div style="margin: 10px 0 6px; font-size: 11.5px; font-weight: 600; color: #8A5A2B">{{grp.name}}</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{grp.items}}" as="it" hint-placeholder-count="4">
<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="text-align: left; min-height: 34px; padding: 7px 10px; border-radius: 8px; border: 1px solid {{it.bd}}; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 13px; line-height: 1.25">{{it.label}}</button>
</sc-for>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isSolo}}" hint-placeholder-val="{{false}}">
<div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #6B6258">Muscle contracting in the right eye</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{soloMus}}" as="it" hint-placeholder-count="6">
<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="height: 44px; border-radius: 9px; border: 1px solid {{it.bd}}; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 14px">{{it.label}}</button>
</sc-for>
</div>
<div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #6B6258; margin-top: 8px">Start position of the eye</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{soloStarts}}" as="it" hint-placeholder-count="3">
<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="text-align: left; min-height: 40px; padding: 6px 12px; border-radius: 9px; border: 1px solid {{it.bd}}; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 13px">{{it.label}}</button>
</sc-for>
</div>
<div style="margin-top: 8px; padding: 12px 14px; background: #F6F3EC; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #333A42">The right eye shows one muscle acting alone. The left eye shows its <b>yoke</b> (Hering's law). Change the start position to see how the action changes with gaze — vertical recti lie 23° and obliques 51° from the visual axis. Watch the iris landmark for torsion.</div>
<div style="flex-grow: 1"></div>
<button class="btn" onClick="{{exitSolo}}" style="height: 44px; border-radius: 10px; border: 1px solid #1C2127; background: #FFFFFF; color: #1C2127; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13px">Back to the H pattern</button>
</sc-if>
</div>

</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12.5px; color: #5E6670">Room light</span>

<sc-for list="{{prooms}}" as="it" hint-placeholder-count="2">
<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="height: 36px; padding: 0 12px; border: none; border-radius: 8px; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 13.5px">{{it.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">

<button class="btn" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="height: 32px; padding: 0 11px; border: none; border-radius: 8px; background: {{it.bg}}; color: {{it.fg}}; font-family: 'IBM Plex Sans', sans-serif; font-weight: 500; font-size: 13px">{{it.label}}</button>

<div style="display: flex; flex-wrap: wrap; gap: 6px">

</div>
